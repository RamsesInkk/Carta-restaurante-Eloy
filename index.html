<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurante Eloy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f0;
            color: #333;
        }

        /* =========================
           ENCABEZADO
        ========================= */

        header {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url("experencia.jpeg");

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 20px;
        }

        /* LOGO */

        .logo {
            width: 190px;
            height: 190px;

            object-fit: contain;

            background: white;

            border-radius: 50%;

            padding: 12px;

            margin-bottom: 25px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
        }

        /* TITULO */

        header h1 {
            font-size: 3rem;
            margin: 10px 0;
        }

        header p {
            font-size: 1.3rem;
            margin: 0 0 30px;
        }

        /* BOTON */

        .boton {
            display: inline-block;

            background: #d4a017;

            color: white;

            text-decoration: none;

            padding: 14px 28px;

            border-radius: 8px;

            font-weight: bold;

            transition: 0.3s;
        }

        .boton:hover {
            background: #b8860b;

            transform: scale(1.05);
        }

        /* =========================
           CONTENEDOR
        ========================= */

        .contenedor {
            max-width: 950px;

            margin: 0 auto;

            padding: 60px 20px;
        }

        /* =========================
           SECCIONES
        ========================= */

        .concepto,
        .experiencia,
        .menu {
            text-align: center;

            margin-bottom: 70px;
        }

        /* TITULOS */

        .concepto h2,
        .experiencia h2,
        .menu h2 {
            color: #8b0000;

            font-size: 2rem;

            margin-bottom: 25px;
        }
